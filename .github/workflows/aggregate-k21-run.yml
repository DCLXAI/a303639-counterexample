name: Aggregate exact K21 run 33414798051

on:
  push:
    branches: [search-sixth-two-coordinate-v3]
    paths:
      - '.github/workflows/aggregate-k21-run.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_RUN: '33414798051'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for all 64 exact shard artifacts
        run: |
          for attempt in $(seq 1 180); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq .status)
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/artifacts?per_page=100" --jq '.artifacts | length')
            echo "attempt=${attempt} status=${status} artifacts=${count}"
            if [ "$status" = completed ] && [ "$count" -eq 64 ]; then
              exit 0
            fi
            sleep 20
          done
          echo 'source run did not complete with 64 artifacts' >&2
          exit 1

      - name: Download every exact shard
        run: |
          mkdir artifacts
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --dir artifacts
          find artifacts -maxdepth 2 -type f | sort | head

      - name: Verify per-shard hashes and aggregate gap-free interval
        run: |
          set -euo pipefail
          for d in artifacts/exact-k21-shard-*; do
            (cd "$d" && sha256sum -c SHA256SUMS.txt)
          done
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          ROOT=Path('artifacts')
          OUT=Path('aggregate');OUT.mkdir()
          summaries=[]
          for p in ROOT.glob('exact-k21-shard-*/summary.json'):
              s=json.loads(p.read_text())
              s['_dir']=str(p.parent)
              summaries.append(s)
          assert len(summaries)==64, len(summaries)
          summaries.sort(key=lambda x:x['start'])

          EXPECTED_START=1_052_049_481_860
          EXPECTED_END=4_116_715_363_799
          cursor=EXPECTED_START
          processed=0
          counterexamples=[]
          blocks=0
          candidates=0
          exact_calls=0
          lattice=0
          shard_rows=[]

          for s in summaries:
              assert s['start']==cursor, (cursor,s['start'])
              assert s['processed']==s['end']-s['start']+1
              cursor=s['end']+1
              processed+=s['processed'];blocks+=s['blocks']
              counterexamples.extend(s['counterexamples'])
              candidates+=s['prefilter_candidates']
              exact_calls+=s['exact_calls_after_prefilter']
              lattice+=s['lattice_pair_visits']
              shard_rows.append({k:s[k] for k in ['shard','start','end','processed','blocks','counterexamples','wall_seconds']})

          assert cursor==EXPECTED_END+1
          assert processed==EXPECTED_END-EXPECTED_START+1
          assert len({s['shard'] for s in summaries})==64

          aggregate={
              'schema':'a303639-k21-exact-complete-v1',
              'source_run':33414798051,
              'start':EXPECTED_START,
              'end':EXPECTED_END,
              'processed':processed,
              'shards':64,
              'blocks':blocks,
              'counterexamples':sorted(counterexamples),
              'prefilter_candidates':candidates,
              'exact_calls_after_prefilter':exact_calls,
              'lattice_pair_visits':lattice,
              'shard_records':shard_rows,
          }
          (OUT/'SUMMARY.json').write_text(json.dumps(aggregate,indent=2)+'\n')
          (OUT/'COUNTEREXAMPLES.txt').write_text('\n'.join(map(str,aggregate['counterexamples']))+('\n' if aggregate['counterexamples'] else ''))
          (OUT/'SOURCE_RUN.txt').write_text('33414798051\n')
          lines=[]
          for p in sorted(OUT.iterdir()):
              if p.name=='SHA256SUMS.txt':continue
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          (OUT/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          print(json.dumps({k:aggregate[k] for k in ['start','end','processed','shards','blocks','counterexamples']},indent=2))
          PY

      - name: Upload audited aggregate
        uses: actions/upload-artifact@v4
        with:
          name: exact-k21-complete-audited
          retention-days: 90
          if-no-files-found: error
          path: aggregate/
