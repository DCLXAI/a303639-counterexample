name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy sympy pytest
      - name: Machine-check all 136 certificates (stdlib only)
        run: python certificates/check_certificates.py certificates/certificates.json
      - name: Verify Lemma 4.1 table (deterministic)
        run: python analysis/forced_table.py
      - name: Test suite (incl. match against official OEIS data)
        run: pytest tests/ -q
      - name: Build and smoke-test searcher (N=1e8)
        run: gcc -O3 -o search searcher/search.c && ./search 100000000
