name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy sympy pytest
      - name: Machine-check all 136 certificates (stdlib only)
        run: python certificates/check_certificates.py certificates/certificates.json
      - name: Verify Lemma 4.1 table (deterministic)
        run: python analysis/forced_table.py
      - name: Test suite (incl. match against official OEIS data)
        run: pytest tests/ -q
      - name: Build searcher and run the full [1, 2e9] scan
        # Must be the full bound: at N=1e8 the cutoff is k<=14, so a searcher
        # that wrongly stops at k=15 still looks correct. Only N > B(16) =
        # 1166803110 exercises the index-16 pairs. ~500 MB, well under the
        # runner's memory.
        run: |
          gcc -O3 -o search searcher/search.c
          ./search 2000000000 > out.txt 2> err.txt
          cat err.txt out.txt
          grep -q 'k = 0\.\.16' err.txt
          grep -q '152 shifts done' err.txt
          [ "$(cat out.txt)" = "COUNTEREXAMPLE n=800322180" ]
